# Application
spring.application.name=pharmacy-information-lookup-api
server.port=8080

# H2 in-memory DB for local development
spring.datasource.url=jdbc:h2:mem:pharmacydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# PostgreSQL (production) - uncomment and configure when deploying
# spring.datasource.url=jdbc:postgresql://localhost:5432/pharmacydb
